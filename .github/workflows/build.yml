name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        run: gradle --no-daemon assembleDebug
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk DLR-MIDI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DLR-MIDI
          path: DLR-MIDI.apk
      - name: Borrar la version anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ultima --cleanup-tag -y || true
      - name: Publicar (ultima version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: DLR MIDI (ultima version)
          prerelease: false
          make_latest: true
          body: "Version ${{ github.run_number }}. Descarga DLR-MIDI.apk desde el telefono e instalalo."
          files: DLR-MIDI.apk
